[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scfm-layer-evaluation"
version = "0.1.0"
description = "Code-only pipeline for layer-wise evaluation of single-cell foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "scanpy",
  "torch",
]

[project.optional-dependencies]
analysis = [
  "matplotlib",
  "dadapy",
  "repitl",
]
test = [
  "pytest>=8",
]
extraction = [
  "tqdm",
  "mygene",
  "performer-pytorch",
  "transformers",
  "datasets",
]

[tool.setuptools.packages.find]
include = ["scfm_eval*"]
